[['rates',B('Zinsen / Finanzierung','Rates / Financing')],['regulation',B('Regulierung','Regulation')],['cities',B('Städte & Regionen','Cities & Regions')],['neighbourhoods',B('Stadtteile / Quartiere','Neighbourhoods')],['architecture',B('Architektur / besondere Immobilien','Architecture / Notable Homes')],['design',B('Design & Wohnen','Design & Living')],['celebrity',B('Promis & Immobilien','Celebrity Property')],['search',B('Search / Nutzerinteresse','Search / User Demand')]].forEach(([id,name])=>modules.push({id,name,future:true}));
let lang='de';const open=new Set(),list=document.getElementById('accordion-list'),popover=document.getElementById('matrix-popover'),T=v=>v[lang];let activeDetail=null,pinned=false;
const searchHtml=m=>`<div class="search-chips">${search[lang].map((group,index)=>`<button type="button" class="detail-chip" data-detail-kind="search" data-detail-index="${index}" data-detail-module="${m.id}" aria-expanded="false" aria-controls="matrix-popover" aria-label="${searchChipLabels[lang][index]} – ${C[lang].details}">${searchChipLabels[lang][index]}</button>`).join('')}</div>`;
const sourceHtml=m=>{const config=sourceConfig[m.id]||{pending:true};const labels=(config.items||[]).map(key=>`<button type="button" class="source-chip" data-detail-kind="source" data-detail-key="${key}" data-detail-module="${m.id}" aria-expanded="false" aria-controls="matrix-popover" aria-label="${T(sourceCatalog[key].label)} – ${C[lang].details}">${T(sourceCatalog[key].label)}</button>`).join('');return`<div class="source-labels">${labels}</div>${config.pending?`<span class="pending">${C[lang].sourceOpen}</span>`:''}`};
const packageHtml=r=>`${r.list?`<strong class="group-label">${T(r.list.label)}</strong><ul>${r.list.items[lang].map(i=>`<li>${i}</li>`).join('')}</ul>`:`<span class="example">${T(r.e)}</span>`}<small class="format-note">${T(r.n)}</small><span class="package-fields">${T(r.plural?F.many:F.one)}</span>`;
const matrixHtml=m=>`<div class="matrix-shell" tabindex="0" aria-label="${T(m.name)} – ${C[lang].title}"><table><colgroup><col class="indicator"><col class="source"><col class="search"><col class="frequency"><col class="comparison"><col class="signal"><col class="package"></colgroup><thead><tr>${C[lang].headers.map(h=>`<th scope="col"><strong>${h[0]}</strong><small>${h[1]}</small></th>`).join('')}</tr></thead><tbody>${m.rows.map((r,i)=>`<tr><td><strong class="cell-title">${T(r.i)}</strong></td>${i===0?`<td class="source-cell" rowspan="${m.rows.length}">${sourceHtml(m)}</td><td class="shared-search-space" rowspan="${m.rows.length}">${searchHtml(m)}</td><td class="frequency-cell" rowspan="${m.rows.length}"><span class="pending">${C[lang].frequencyOpen}</span></td>`:''}<td>${T(r.c)}${r.cp?`<span class="pending">${T(r.cp)}</span>`:''}</td><td><strong class="cell-title">${T(r.st)}</strong>${T(r.s)}<span class="pending">${T(r.p)}</span></td><td>${packageHtml(r)}</td></tr>`).join('')}</tbody></table></div>`;
const futureHtml=()=>`<div class="future-content"><h3>${C[lang].fh}</h3><p>${C[lang].fb}</p><p><strong>${C[lang].el}</strong> ${C[lang].eb}</p></div>`;
const detailMarkup=button=>{if(button.dataset.detailKind==='source'){const source=sourceCatalog[button.dataset.detailKey];return`<h3>${T(source.label)}</h3><code>${source.table}</code>`}const index=Number(button.dataset.detailIndex),[title,items,pending]=search[lang][index],general=index===search[lang].length-1?T(search.note):'';return`<h3>${title}</h3><ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul>${pending?`<span class="pending">${pending}</span>`:''}${general?`<span class="pending">${general}</span>`:''}`};
const positionDetail=button=>{const anchor=button.getBoundingClientRect(),box=popover.getBoundingClientRect(),margin=12;let x=anchor.left+anchor.width/2-box.width/2;x=Math.max(margin,Math.min(x,window.innerWidth-box.width-margin));let y=anchor.bottom+8;if(y+box.height>window.innerHeight-margin)y=anchor.top-box.height-8;popover.style.left=`${x}px`;popover.style.top=`${Math.max(margin,y)}px`};
function showDetail(button,pin=false){if(activeDetail&&activeDetail!==button)activeDetail.setAttribute('aria-expanded','false');activeDetail=button;pinned=pin||pinned;button.setAttribute('aria-expanded','true');popover.innerHTML=detailMarkup(button);popover.hidden=false;requestAnimationFrame(()=>positionDetail(button))}
function hideDetail(force=false){if(pinned&&!force)return;if(activeDetail)activeDetail.setAttribute('aria-expanded','false');activeDetail=null;pinned=false;popover.hidden=true}
function render(){hideDetail(true);const c=C[lang];document.documentElement.lang=lang;document.getElementById('subline').textContent=c.sub;document.getElementById('matrix-title').textContent=c.title;document.getElementById('language-switch').setAttribute('aria-label',c.language);list.innerHTML=modules.map(m=>{const expanded=open.has(m.id),panel=`panel-${m.id}`;return`<article class="accordion-item"><h2><button class="accordion-trigger" type="button" aria-expanded="${expanded}" aria-controls="${panel}" data-module-id="${m.id}" aria-label="${T(m.name)} ${expanded?c.close:c.open}"><span class="topic-name">${T(m.name)}</span><span class="status ${m.future?'':'mvp'}">${m.future?c.future:c.mvp}</span><span class="chevron" aria-hidden="true"></span></button></h2><div class="accordion-panel" id="${panel}" ${expanded?'':'hidden'}>${m.future?futureHtml():matrixHtml(m)}</div></article>`}).join('');document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===lang)))}
list.addEventListener('pointerover',e=>{const b=e.target.closest('[data-detail-kind]');if(b&&!pinned)showDetail(b)});
list.addEventListener('pointerout',e=>{const b=e.target.closest('[data-detail-kind]');if(b&&!b.contains(e.relatedTarget))hideDetail()});
list.addEventListener('focusin',e=>{const b=e.target.closest('[data-detail-kind]');if(b&&!pinned)showDetail(b)});
list.addEventListener('focusout',e=>{if(e.target.closest('[data-detail-kind]'))hideDetail()});
list.addEventListener('click',e=>{const detail=e.target.closest('[data-detail-kind]');if(detail){if(activeDetail===detail&&pinned)hideDetail(true);else{pinned=false;showDetail(detail,true)}return}const b=e.target.closest('.accordion-trigger');if(!b)return;const id=b.dataset.moduleId;open.has(id)?open.delete(id):open.add(id);render();document.querySelector(`[data-module-id="${id}"]`).focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeDetail){const target=activeDetail;hideDetail(true);target.focus()}});
document.addEventListener('pointerdown',e=>{if(pinned&&!e.target.closest('[data-detail-kind]'))hideDetail(true)});
window.addEventListener('resize',()=>hideDetail(true));
document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.language==='en'?'en':'de';render()}));render();
})();
</script></body></html>
