<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Scaling Editorial · Content Plan</title>
  <style>
    :root {
      --bg: #101514;
      --surface: #151d1a;
      --surface-2: #18231f;
      --header: #1b332e;
      --accent: #49d8bf;
      --accent-soft: #bcece3;
      --accent-bg: #183a35;
      --accent-line: #40887b;
      --text: #f1f5f3;
      --soft: #ccd6d2;
      --muted: #91a19b;
      --line: #354b44;
      --warning: #d9ca95;
      --warning-bg: #302d22;
      --warning-line: #6d6245;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Make It Better", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .page {
      width: min(1380px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .page-header {
      position: relative;
    }

    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .status-label {
      display: inline-flex;
      margin: 0;
      padding: 5px 9px;
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      color: #b9e8df;
      background: var(--accent-bg);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .075em;
    }

    h1 {
      margin: 13px 0 0;
      font-size: clamp(31px, 3.5vw, 48px);
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    .subline {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid #35423e;
      border-radius: 999px;
      background: #171d1b;
    }

    .switch button {
      min-width: 54px;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      color: #88938f;
      background: transparent;
      font-size: 10px;
      font-weight: 720;
      line-height: 1;
      cursor: pointer;
    }

    .switch button[aria-pressed="true"] {
      color: #d7e6e1;
      background: #23312d;
    }

    .switch button:hover { color: #b8c5c1; }

    .switch button:focus-visible {
      outline: 2px solid #6d9a90;
      outline-offset: 2px;
    }

    .plan {
      margin-top: 27px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden;
    }

    .plan[hidden] { display: none; }

    .matrix-scroll {
      width: 100%;
      overflow-x: auto;
      scrollbar-color: #58726a #15201d;
      scrollbar-width: thin;
      overscroll-behavior-x: contain;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      text-align: left;
    }

    .target-table col.day { width: 18%; }
    .target-table col.articles { width: 16%; }
    .target-table col.focus { width: 66%; }
    .mvp-table col.area { width: 30%; }
    .mvp-table col.approach { width: 70%; }

    th,
    td {
      padding: 16px 18px;
      border-right: 1px solid rgba(107, 136, 128, .28);
      border-bottom: 1px solid rgba(107, 136, 128, .28);
      vertical-align: top;
    }

    th:last-child,
    td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }

    thead th {
      color: var(--accent-soft);
      background: var(--header);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .025em;
    }

    tbody td {
      color: var(--soft);
      background: var(--surface);
      font-size: 14px;
      line-height: 1.5;
    }

    .day-name,
    .planning-area {
      color: var(--text);
      font-size: 15px;
      font-weight: 720;
    }

    .article-count {
      color: var(--text);
      font-size: 22px;
      font-weight: 760;
      line-height: 1.15;
    }

    .focus-title {
      display: block;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .examples {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12.5px;
    }

    .total-row td { background: #17251f; }
    .total-row .article-count { color: var(--accent-soft); }

    .capacity-label {
      display: inline-flex;
      margin-top: 5px;
      padding: 4px 7px;
      border: 1px solid var(--warning-line);
      border-radius: 6px;
      color: var(--warning);
      background: var(--warning-bg);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .plan-footer {
      padding: 18px;
      border-top: 1px solid var(--line);
      background: var(--surface-2);
    }

    .footer-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .065em;
      text-transform: uppercase;
    }

    .publishing-windows {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .window-chip {
      display: inline-flex;
      align-items: center;
      min-height: 31px;
      padding: 6px 10px;
      border: 1px solid #3c5d55;
      border-radius: 999px;
      color: #c8ddd7;
      background: #1b302b;
      font-size: 12px;
      font-weight: 680;
    }

    .window-note,
    .hypothesis-note,
    .mvp-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .hypothesis-note {
      padding-top: 12px;
      border-top: 1px solid rgba(107, 136, 128, .24);
      color: var(--soft);
    }

    .hypothesis-note strong { color: var(--accent-soft); }
    .mvp-note { margin: 0; padding: 17px 18px; border-top: 1px solid var(--line); color: var(--soft); background: var(--surface-2); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .page { width: calc(100% - 24px); padding: 24px 0 36px; }
      .top-row { align-items: flex-start; flex-wrap: wrap; }
      .controls { flex-wrap: wrap; }
      .plan { margin-top: 22px; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="top-row">
        <span class="status-label">UPDATED · 1 OCT 2026</span>
        <div class="controls">
          <div class="switch" id="mode-switch" role="group">
            <button type="button" data-mode="target" aria-pressed="true" aria-controls="target-plan">Target</button>
            <button type="button" data-mode="mvp" aria-pressed="false" aria-controls="mvp-plan">MVP</button>
          </div>
          <div class="switch" id="language-switch" role="group">
            <button type="button" data-language="de" aria-pressed="true">DE</button>
            <button type="button" data-language="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>
      <h1>Scaling Editorial · Content Plan</h1>
      <p class="subline" id="subline"></p>
    </header>

    <section class="plan" id="target-plan" aria-labelledby="target-title">
      <h2 class="sr-only" id="target-title"></h2>
      <div class="matrix-scroll" tabindex="0">
        <table class="target-table">
          <colgroup><col class="day"><col class="articles"><col class="focus"></colgroup>
          <thead id="target-head"></thead>
          <tbody id="target-body"></tbody>
        </table>
      </div>
      <div class="plan-footer">
        <span class="footer-label" id="windows-label"></span>
        <div class="publishing-windows" id="publishing-windows"></div>
        <p class="window-note" id="window-note"></p>
        <p class="hypothesis-note" id="hypothesis-note"></p>
      </div>
    </section>

    <section class="plan" id="mvp-plan" aria-labelledby="mvp-title" hidden>
      <h2 class="sr-only" id="mvp-title"></h2>
      <div class="matrix-scroll" tabindex="0">
        <table class="mvp-table">
          <colgroup><col class="area"><col class="approach"></colgroup>
          <thead id="mvp-head"></thead>
          <tbody id="mvp-body"></tbody>
        </table>
      </div>
      <p class="mvp-note" id="mvp-note"></p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const copy = {
        de: {
          subline: 'Der Content Plan zeigt die aktuelle Working Hypothesis für Content Mix und Publishing Cadence sowie den reduzierten MVP-Ansatz.',
          language: 'Sprache', view: 'Planungsansicht', targetTitle: 'Target Content Plan', mvpTitle: 'MVP Content Plan',
          targetHeaders: ['Tag', 'Artikel', 'Redaktioneller Schwerpunkt'],
          days: [
            ['Montag', '10', 'Market Journalism · Service-led Explainers', 'Marktveränderungen · Preise · Angebot / Nachfrage · praktische Orientierung'],
            ['Dienstag', '9', 'Evergreen Expertise', 'Mieten · Kaufen · Finanzierung'],
            ['Mittwoch', '8', 'Market Journalism · Local & Property Stories', 'Marktanalysen · Stadttrends · Stadtteile'],
            ['Donnerstag', '7', 'Local & Property Stories · Service-led Explainers', 'Lokale Storys · Umzug · Besichtigung · Vorbereitung des Zuhauses'],
            ['Freitag', '6', 'Design · Lifestyle · Remarkable Properties', ''],
            ['Samstag', '5', 'Recurring Curiosity Formats', 'Architektur · Interior · Promis & Immobilien · besondere Immobilien'],
            ['Sonntag', '5', 'Property Inspiration · Preparation', '']
          ],
          total: 'Gesamt', capacity: 'Arbeitsannahme zur Kapazität', windowsLabel: 'Publishing-Fenster',
          windows: ['Hauptfenster · 10:30–11:30', 'Sekundär · 18:30–19:30', 'Aktuelle News · veröffentlichen, sobald geprüft'],
          windowNote: 'Die Zeitfenster sind eine Testhypothese und werden später anhand echter Editorial-Performance angepasst.',
          hypothesisLabel: 'Working Hypothesis:',
          hypothesis: 'Volumen, Content Mix und Publishing Cadence sind noch keine verbindlichen Commitments. Der MVP soll zeigen, welche Produktions- und Review-Kapazität tatsächlich realistisch und nachhaltig ist.',
          mvpHeaders: ['Planungsbereich', 'MVP-Ansatz'],
          mvpRows: [
            ['Content Scope', 'Wenige Trendfelder / Signal Types mit zuverlässig verfügbaren Daten'],
            ['Content Output', 'Wenige vollständige End-to-End-Test-Storys'],
            ['Publishing', 'Veröffentlichen, sobald Story, Human Review und Publishing-Pfad bereit sind'],
            ['Cadence', 'Noch keine feste Wochen- oder Tagescadence'],
            ['Purpose', 'Produktionskette und reale Review-/Publishing-Kapazität validieren']
          ],
          mvpNote: 'Die Target-Planung wird belastbarer, sobald der MVP echte Daten zu Story-Qualität, Produktionsaufwand und Human Review liefert.'
        },
        en: {
          subline: 'The Content Plan shows the current working hypothesis for content mix and publishing cadence together with the reduced MVP approach.',
          language: 'Language', view: 'Planning view', targetTitle: 'Target Content Plan', mvpTitle: 'MVP Content Plan',
          targetHeaders: ['Day', 'Articles', 'Editorial Focus'],
          days: [
            ['Monday', '10', 'Market Journalism · Service-led Explainers', 'Market changes · prices · supply / demand · practical guidance'],
            ['Tuesday', '9', 'Evergreen Expertise', 'Renting · buying · financing'],
            ['Wednesday', '8', 'Market Journalism · Local & Property Stories', 'Market analysis · city trends · neighbourhoods'],
            ['Thursday', '7', 'Local & Property Stories · Service-led Explainers', 'Local stories · moving · viewing · home preparation'],
            ['Friday', '6', 'Design · Lifestyle · Remarkable Properties', ''],
            ['Saturday', '5', 'Recurring Curiosity Formats', 'Architecture · interiors · celebrity property · remarkable homes'],
            ['Sunday', '5', 'Property Inspiration · Preparation', '']
          ],
          total: 'Total', capacity: 'Working capacity assumption', windowsLabel: 'Publishing windows',
          windows: ['Main · 10:30–11:30', 'Secondary · 18:30–19:30', 'Timely News · Publish when verified'],
          windowNote: 'The publishing windows are a test hypothesis and will later be adjusted based on actual editorial performance.',
          hypothesisLabel: 'Working hypothesis:',
          hypothesis: 'Volume, content mix and publishing cadence are not committed targets yet. The MVP will show which production and review capacity is actually realistic and sustainable.',
          mvpHeaders: ['Planning Area', 'MVP Approach'],
          mvpRows: [
            ['Content Scope', 'A small number of Trend Fields / Signal Types with reliably available data'],
            ['Content Output', 'A small number of complete end-to-end test stories'],
            ['Publishing', 'Publish once the story, Human Review and publishing path are ready'],
            ['Cadence', 'No fixed weekly or daily cadence yet'],
            ['Purpose', 'Validate the production chain and real review / publishing capacity']
          ],
          mvpNote: 'The Target plan becomes more reliable once the MVP provides real evidence on story quality, production effort and Human Review.'
        }
      };

      let language = 'de';
      let mode = 'target';

      const render = () => {
        const c = copy[language];
        document.documentElement.lang = language;
        document.getElementById('subline').textContent = c.subline;
        document.getElementById('language-switch').setAttribute('aria-label', c.language);
        document.getElementById('mode-switch').setAttribute('aria-label', c.view);
        document.getElementById('target-title').textContent = c.targetTitle;
        document.getElementById('mvp-title').textContent = c.mvpTitle;

        document.getElementById('target-head').innerHTML = `<tr>${c.targetHeaders.map((header) => `<th scope="col">${header}</th>`).join('')}</tr>`;
        document.getElementById('target-body').innerHTML = `${c.days.map(([day, count, focus, examples]) => `<tr><td class="day-name">${day}</td><td class="article-count">${count}</td><td><span class="focus-title">${focus}</span>${examples ? `<span class="examples">${examples}</span>` : ''}</td></tr>`).join('')}<tr class="total-row"><td class="day-name">${c.total}</td><td><span class="article-count">50</span><br><span class="capacity-label">${c.capacity}</span></td><td></td></tr>`;
        document.getElementById('windows-label').textContent = c.windowsLabel;
        document.getElementById('publishing-windows').innerHTML = c.windows.map((windowLabel) => `<span class="window-chip">${windowLabel}</span>`).join('');
        document.getElementById('window-note').textContent = c.windowNote;
        document.getElementById('hypothesis-note').innerHTML = `<strong>${c.hypothesisLabel}</strong> ${c.hypothesis}`;

        document.getElementById('mvp-head').innerHTML = `<tr>${c.mvpHeaders.map((header) => `<th scope="col">${header}</th>`).join('')}</tr>`;
        document.getElementById('mvp-body').innerHTML = c.mvpRows.map(([area, approach]) => `<tr><td class="planning-area">${area}</td><td>${approach}</td></tr>`).join('');
        document.getElementById('mvp-note').textContent = c.mvpNote;

        document.getElementById('target-plan').hidden = mode !== 'target';
        document.getElementById('mvp-plan').hidden = mode !== 'mvp';
        document.querySelectorAll('[data-language]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.language === language)));
        document.querySelectorAll('[data-mode]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      };

      document.querySelectorAll('[data-language]').forEach((button) => {
        button.addEventListener('click', () => {
          language = button.dataset.language === 'en' ? 'en' : 'de';
          render();
        });
      });

      document.querySelectorAll('[data-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          mode = button.dataset.mode === 'mvp' ? 'mvp' : 'target';
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
