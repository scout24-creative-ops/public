<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Scaling Editorial · Working Plan</title>
  <style>
    :root {
      --bg: #101514;
      --surface: #151d1a;
      --surface-2: #19231f;
      --header: #1b332e;
      --accent: #49d8bf;
      --accent-soft: #bcece3;
      --accent-bg: #183a35;
      --accent-line: #40887b;
      --text: #f1f5f3;
      --soft: #ccd6d2;
      --muted: #91a19b;
      --line: #354b44;
      --week-line: rgba(122, 167, 156, .13);
      --vacation: rgba(197, 169, 104, .075);
      --vacation-line: rgba(197, 169, 104, .2);
      --task: #244b43;
      --task-line: #40887b;
      --completed: #236a4b;
      --completed-line: #55bd87;
      --planned: #203947;
      --planned-line: #3d6478;
      --label-width: 238px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Make It Better", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .page {
      width: min(1380px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .page-header {
      position: relative;
    }

    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .updated-label {
      display: inline-flex;
      margin: 0;
      padding: 5px 9px;
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      color: #b9e8df;
      background: var(--accent-bg);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .075em;
      text-transform: uppercase;
    }

    h1 {
      margin: 13px 0 0;
      font-size: clamp(31px, 3.5vw, 48px);
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    .subline {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .intro {
      max-width: 1030px;
      margin: 17px 0 0;
      color: var(--soft);
      font-size: 13px;
      line-height: 1.6;
    }

    .language-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid #35423e;
      border-radius: 999px;
      background: #171d1b;
    }

    .language-switch button {
      min-width: 54px;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      color: #88938f;
      background: transparent;
      font-size: 10px;
      font-weight: 720;
      line-height: 1;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      color: #d7e6e1;
      background: #23312d;
    }

    .language-switch button:hover { color: #b8c5c1; }

    .language-switch button:focus-visible,
    .task-bar:focus-visible {
      outline: 2px solid #6d9a90;
      outline-offset: 2px;
    }

    .timeline-section { margin-top: 27px; }

    .timeline-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      scrollbar-color: #58726a #15201d;
      scrollbar-width: thin;
      overscroll-behavior-x: contain;
    }

    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: var(--label-width) minmax(1040px, 1fr);
      min-width: 1278px;
      isolation: isolate;
    }

    .corner,
    .months,
    .week-label,
    .weeks,
    .row-label,
    .track {
      position: relative;
      z-index: 2;
      border-bottom: 1px solid rgba(107, 136, 128, .24);
    }

    .corner,
    .week-label,
    .row-label {
      position: sticky;
      left: 0;
      z-index: 6;
      border-right: 1px solid var(--line);
      background: #18231f;
    }

    .corner {
      display: flex;
      align-items: flex-end;
      padding: 15px 18px;
      color: #9fb0aa;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .months {
      display: grid;
      grid-template-columns: 31fr 30fr 31fr 31fr;
      min-height: 76px;
      background: var(--header);
    }

    .month {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px 18px;
      border-right: 1px solid rgba(146, 190, 178, .25);
    }

    .month:last-child { border-right: 0; }
    .month.cleaning { background: #20302f; }
    .month strong { color: var(--accent-soft); font-size: 15px; }
    .month small { margin-top: 4px; color: #8fa59e; font-size: 10px; }

    .week-label {
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: #82958f;
      font-size: 9px;
      font-weight: 730;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .weeks {
      display: flex;
      min-height: 38px;
      background: #17211e;
    }

    .week {
      flex: 0 0 auto;
      padding: 12px 0 0 7px;
      border-right: 1px solid var(--week-line);
      color: #778b85;
      font-size: 8px;
      font-weight: 720;
    }

    .row-label {
      display: flex;
      align-items: center;
      min-height: 67px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 12px;
      font-weight: 690;
      line-height: 1.35;
    }

    .track {
      min-height: 67px;
    }

    .week-line {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 1;
      width: 1px;
      background: var(--week-line);
      pointer-events: none;
    }

    .task-bar {
      position: absolute;
      top: 17px;
      z-index: 4;
      height: 33px;
      min-width: 17px;
      overflow: hidden;
      padding: 0 11px;
      border: 1px solid var(--task-line);
      border-radius: 7px;
      color: #e5f1ed;
      background: var(--task);
      font-size: 9.5px;
      font-weight: 720;
      line-height: 31px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: help;
    }

    .task-bar.planned {
      border-color: var(--planned-line);
      background: var(--planned);
    }

    .task-bar.completed {
      border-color: var(--completed-line);
      background: var(--completed);
    }

    .vacation-layer,
    .cleaning-layer,
    .marker-layer {
      position: absolute;
      top: 76px;
      right: 0;
      bottom: 0;
      left: var(--label-width);
      z-index: 1;
      pointer-events: none;
    }

    .vacation-layer { z-index: 3; }
    .cleaning-layer { z-index: 1; }
    .marker-layer { z-index: 5; }

    .vacation-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      border-right: 1px solid var(--vacation-line);
      border-left: 1px solid var(--vacation-line);
      background: var(--vacation);
    }

    .vacation-zone span {
      position: absolute;
      top: 5px;
      left: 7px;
      max-width: calc(100% - 14px);
      overflow: hidden;
      color: #baa875;
      font-size: 8px;
      font-weight: 730;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cleaning-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid rgba(103, 158, 148, .34);
      background: rgba(77, 126, 119, .065);
    }

    .marker-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(73, 216, 191, .32);
    }

    .marker-line.today { background: rgba(188, 236, 227, .55); }

    .today-label {
      position: absolute;
      top: 5px;
      left: 5px;
      padding: 3px 6px;
      border-radius: 5px;
      color: #dcece7;
      background: #263c36;
      font-size: 7.5px;
      font-weight: 780;
      letter-spacing: .045em;
      white-space: nowrap;
    }

    .end-label {
      position: absolute;
      top: 5px;
      padding: 3px 6px;
      border: 1px solid var(--accent-line);
      border-radius: 5px;
      color: #ccebe4;
      background: #203a34;
      font-size: 7.5px;
      font-weight: 780;
      letter-spacing: .035em;
      white-space: nowrap;
      transform: translateX(-100%);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin: 13px 3px 0;
      color: var(--muted);
      font-size: 10px;
    }

    .legend-item { display: inline-flex; gap: 7px; align-items: center; }
    .legend-swatch { width: 18px; height: 8px; border: 1px solid var(--task-line); border-radius: 3px; background: var(--task); }
    .legend-swatch.completed { border-color: var(--completed-line); background: var(--completed); }
    .legend-swatch.planned { border-color: var(--planned-line); background: var(--planned); }
    .legend-swatch.vacation { border-color: var(--vacation-line); background: var(--vacation); }

    .popover {
      position: fixed;
      z-index: 100;
      width: min(360px, calc(100vw - 24px));
      padding: 17px 18px;
      border: 1px solid #3c5650;
      border-radius: 12px;
      color: var(--soft);
      background: #17211e;
      box-shadow: 0 18px 46px rgba(0, 0, 0, .38);
      font-size: 11px;
      line-height: 1.48;
      pointer-events: none;
    }

    .popover[hidden] { display: none; }
    .popover h3 { margin: 0 0 7px; color: var(--text); font-size: 15px; line-height: 1.25; }
    .popover p { margin: 0; }
    .popover ul { margin: 10px 0 0; padding: 0; list-style: none; }
    .popover li { position: relative; padding: 2px 0 2px 12px; }
    .popover li::before { position: absolute; top: 8px; left: 1px; width: 4px; height: 4px; border-radius: 50%; background: #68968c; content: ""; }
    .popover .detail-note { margin-top: 10px; color: #aebdb8; }
    .popover .outcome { margin-top: 11px; padding-top: 9px; border-top: 1px solid #31433e; color: #bcece3; }
    .popover .outcome strong { color: #85aaa1; font-size: 8px; letter-spacing: .07em; text-transform: uppercase; }

    @media (max-width: 720px) {
      .page { width: calc(100% - 24px); padding: 24px 0 36px; }
      .top-row { align-items: flex-start; flex-wrap: wrap; }
      .timeline-section { margin-top: 22px; }
      .timeline-scroll { border-radius: 10px; }
    }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="top-row">
        <span class="updated-label">UPDATED · 1 OCT 2026</span>
        <div class="language-switch" id="language-switch" role="group">
          <button type="button" data-language="de" aria-pressed="true">DE</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <h1>Scaling Editorial · Working Plan</h1>
      <p class="subline" id="subline"></p>

    <section class="timeline-section" aria-labelledby="timeline-title">
      <h2 id="timeline-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"></h2>
      <div class="timeline-scroll" tabindex="0" id="timeline-scroll"></div>
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <aside class="popover" id="popover" role="tooltip" hidden></aside>

        {
          id: 'cleaning', status: 'planned', name: B('Cleaning Month · Learnings & Next Scope', 'Cleaning Month · Learnings & Next Scope'), start: '2027-01-01', end: '2027-01-31',
          description: B('Nach C3 wird der MVP aufgeräumt, ausgewertet und für den nächsten Cycle vorbereitet.', 'After C3, clean up and evaluate the MVP and prepare it for the next cycle.'),
          bullets: B(['zentrale C3-Learnings dokumentieren', 'technische und redaktionelle offene Punkte aufräumen', 'Agent Instructions konsolidieren', 'bekannte Schwächen und technische Schulden dokumentieren oder beheben', 'Review- und Publishing-Learnings zusammenführen', 'wiederverwendbare Templates und Dokumentation bereinigen', 'entscheiden, welche Datenquellen als Nächstes ergänzt werden', 'entscheiden, welche Trendfelder / Topics erweitert werden', 'nächste Automatisierungsmöglichkeiten priorisieren', 'nächsten Scope vorbereiten'], ['document key C3 learnings', 'clean up remaining technical and editorial issues', 'consolidate Agent Instructions', 'document or resolve known weaknesses and technical debt', 'consolidate review and publishing learnings', 'clean up reusable templates and documentation', 'decide which data sources should be added next', 'decide which Trend Fields / Topics should be expanded', 'prioritise the next automation opportunities', 'prepare the next scope']),
          outcome: B('Ein sauber dokumentierter MVP und ein klarer Ausgangspunkt für den nächsten Cycle.', 'A clean, documented MVP and a clear starting point for the next cycle.')
        }
      ];

      const workstreamOrder = ['foundation', 'initial-agents', 'base-rules', 'quality', 'review', 'publishing', 'automation', 'tests', 'stabilise', 'cleaning'];
      workstreams.sort((a, b) => workstreamOrder.indexOf(a.id) - workstreamOrder.indexOf(b.id));

      const start = Date.UTC(2026, 9, 1);
      const days = 123;
      const dayIndex = (date) => (Date.parse(`${date}T00:00:00Z`) - start) / 86400000;
      const left = (date, centre = false) => ((dayIndex(date) + (centre ? .5 : 0)) / days) * 100;
      const width = (from, to) => ((dayIndex(to) - dayIndex(from) + 1) / days) * 100;
      const calendarWeeks = [
        ['KW40', '2026-10-01', '2026-10-04'], ['KW41', '2026-10-05', '2026-10-11'],
        ['KW42', '2026-10-12', '2026-10-18'], ['KW43', '2026-10-19', '2026-10-25'],
        ['KW44', '2026-10-26', '2026-11-01'], ['KW45', '2026-11-02', '2026-11-08'],
        ['KW46', '2026-11-09', '2026-11-15'], ['KW47', '2026-11-16', '2026-11-22'],
        ['KW48', '2026-11-23', '2026-11-29'], ['KW49', '2026-11-30', '2026-12-06'],
        ['KW50', '2026-12-07', '2026-12-13'], ['KW51', '2026-12-14', '2026-12-20'],
        ['KW52', '2026-12-21', '2026-12-27'], ['KW53', '2026-12-28', '2027-01-03'],
        ['KW1', '2027-01-04', '2027-01-10'], ['KW2', '2027-01-11', '2027-01-17'],
        ['KW3', '2027-01-18', '2027-01-24'], ['KW4', '2027-01-25', '2027-01-31']
      ];

      let language = 'de';
      const timelineScroll = document.getElementById('timeline-scroll');
      const popover = document.getElementById('popover');
      const T = (value) => value[language];

      const detailMarkup = (item) => {
        const bullets = item.bullets ? `<ul>${T(item.bullets).map((bullet) => `<li>${bullet}</li>`).join('')}</ul>` : '';
        const note = item.note ? `<p class="detail-note">${T(item.note)}</p>` : '';
        const targetFlow = item.targetFlow ? `<p class="outcome"><strong>${ui[language].targetFlow}</strong><br>${T(item.targetFlow)}</p>` : '';
        const outcome = item.outcome ? `<p class="outcome"><strong>${ui[language].outcome}</strong><br>${T(item.outcome)}</p>` : '';
        return `<h3>${T(item.name || item.title)}</h3><p>${T(item.description)}</p>${bullets}${note}${targetFlow}${outcome}`;
      };

      const taskBar = (workstream, from, to) => `<button type="button" class="task-bar ${workstream.status}" style="left:${left(from)}%;width:${width(from, to)}%" data-detail-type="workstream" data-detail-id="${workstream.id}" aria-describedby="popover">${T(workstream.name)}</button>`;

      const render = () => {
        const c = ui[language];
        document.documentElement.lang = language;
        document.getElementById('subline').textContent = c.subline;
        document.getElementById('timeline-title').textContent = c.timeline;
        document.getElementById('language-switch').setAttribute('aria-label', c.language);
        document.querySelectorAll('[data-language]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.language === language)));

        const monthMarkup = c.months.map(([month, story], index) => `<div class="month ${index === 3 ? 'cleaning' : ''}"><strong>${month}</strong><small>${story}</small></div>`).join('');
        const weekMarkup = calendarWeeks.map(([label, from, to]) => `<span class="week" style="width:${width(from, to)}%">${language === 'de' ? label : label.replace('KW', 'W')}</span>`).join('');
        const weekLines = calendarWeeks.slice(1).map(([, from]) => `<span class="week-line" style="left:${left(from)}%"></span>`).join('');
        const rows = workstreams.map((workstream) => {
          const bars = workstream.segments ? workstream.segments.map(([from, to]) => taskBar(workstream, from, to)).join('') : taskBar(workstream, workstream.start, workstream.end);
          return `<div class="row-label">${T(workstream.name)}</div><div class="track">${weekLines}${bars}</div>`;
        }).join('');

        timelineScroll.setAttribute('aria-label', c.timeline);
        timelineScroll.innerHTML = `<div class="timeline">
          <div class="corner">${c.workstream}</div><div class="months">${monthMarkup}</div>
          <div class="week-label">${c.weeks}</div><div class="weeks">${weekMarkup}</div>
          ${rows}
          <div class="vacation-layer" aria-hidden="true">
            <div class="vacation-zone" style="left:${left('2026-10-05')}%;width:${width('2026-10-05', '2026-10-18')}%"><span>${c.vacationOne}</span></div>
            <div class="vacation-zone" style="left:${left('2026-12-22')}%;width:${width('2026-12-22', '2026-12-31')}%"><span>${c.vacationTwo}</span></div>
          </div>
          <div class="cleaning-layer" aria-hidden="true">
            <div class="cleaning-zone" style="left:${left('2027-01-01')}%;width:${width('2027-01-01', '2027-01-31')}%"></div>
          </div>
          <div class="marker-layer" aria-hidden="true">
            <span class="marker-line today" style="left:${left('2026-10-01', true)}%"><span class="today-label">${c.today}</span></span>
            <span class="marker-line" style="left:${left('2027-01-01')}%"><span class="end-label">${c.c3End}</span></span>
          </div>
        </div>`;

        document.getElementById('legend').innerHTML = `
          <span class="legend-item"><span class="legend-swatch completed"></span>${c.completed}</span>
          <span class="legend-item"><span class="legend-swatch planned"></span>${c.planned}</span>
          <span class="legend-item"><span class="legend-swatch vacation"></span>${c.capacity}</span>`;
        hidePopover();
      };

      const findDetail = (element) => workstreams.find((item) => item.id === element.dataset.detailId);

      const positionPopover = (element) => {
        const anchor = element.getBoundingClientRect();
        const box = popover.getBoundingClientRect();
        const margin = 12;
        let x = anchor.left + anchor.width / 2 - box.width / 2;
        x = Math.max(margin, Math.min(x, window.innerWidth - box.width - margin));
        let y = anchor.bottom + 9;
        if (y + box.height > window.innerHeight - margin) y = anchor.top - box.height - 9;
        y = Math.max(margin, y);
        popover.style.left = `${x}px`;
        popover.style.top = `${y}px`;
      };

      const showPopover = (element) => {
        const item = findDetail(element);
        if (!item) return;
        popover.innerHTML = detailMarkup(item);
        popover.hidden = false;
        requestAnimationFrame(() => positionPopover(element));
      };

      function hidePopover() { popover.hidden = true; }

      timelineScroll.addEventListener('pointerover', (event) => {
        const element = event.target.closest('[data-detail-id]');
        if (element) showPopover(element);
      });
      timelineScroll.addEventListener('pointerout', (event) => {
        const element = event.target.closest('[data-detail-id]');
        if (element && !element.contains(event.relatedTarget)) hidePopover();
      });
      timelineScroll.addEventListener('focusin', (event) => {
        const element = event.target.closest('[data-detail-id]');
        if (element) showPopover(element);
      });
      timelineScroll.addEventListener('focusout', hidePopover);
      window.addEventListener('resize', hidePopover);
      timelineScroll.addEventListener('scroll', hidePopover, { passive: true });

      document.querySelectorAll('[data-language]').forEach((button) => {
        button.addEventListener('click', () => {
          language = button.dataset.language === 'en' ? 'en' : 'de';
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
